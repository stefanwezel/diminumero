[project]
name = "diminumero"
version = "0.1.0"
description = "Interactive web app to practice number translations in multiple languages - say my number!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=21.2.0",
    "python-dotenv>=1.2.2",
    "authlib>=1.7.1",
    "requests>=2.31.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "psycopg[binary]>=3.1.0",
    # Server-side worksheet PDFs. Renders the same HTML + print CSS the
    # browser prints, and picks fonts up through fontconfig — which is why the
    # Dockerfile has to install font packages (see the Unicode note there).
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-flask>=1.3.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
exclude = ["__pycache__", ".venv", "venv", "build", "dist", ".git"]

