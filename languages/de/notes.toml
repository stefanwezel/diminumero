# Notes for German numbers. See ADD_NOTES.md for the format.

language = "de"
authored_in = "en"

[[note]]
id = "de-units-before-tens"
applies_to = "21-99"
text = "German says the units before the tens, joined by und into one word: einundzwanzig is literally one-and-twenty. English speakers reliably read the digits in the wrong order at speed."
reviewed = false

  [[note.examples]]
  phrase = "einundzwanzig"
  gloss = "twenty-one"

  [[note.examples]]
  phrase = "siebenundvierzig"
  gloss = "forty-seven"

[[note]]
id = "de-eins-loses-s"
applies_to = "21,31,41,51,61,71,81,91"
text = "On its own the number one is eins, but inside a compound it drops the s: einundzwanzig, not einsundzwanzig."
reviewed = false
